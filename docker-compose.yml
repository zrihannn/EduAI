version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduai-postgres
    environment:
      POSTGRES_DB: eduai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduai-network

  redis:
    image: redis:7-alpine
    container_name: eduai-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduai-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=eduai
      - DB_USER=postgres
      - DB_PASS=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_AI_SERVICE_URL=http://python-ai-service:8001
    networks:
      - eduai-network

  python-ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: eduai-python
    ports:
      - "8001:8001"
    networks:
      - eduai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api/v1
    container_name: eduai-frontend
    ports:
      - "5173:80"
    networks:
      - eduai-network

networks:
  eduai-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
